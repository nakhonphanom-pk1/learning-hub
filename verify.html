*{box-sizing:border-box}

.head img{width:40px;height:auto}
.head b{display:block;font-size:16px}

.body{padding:24px 22px 26px}
.status{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;margin-bottom:18px}

.bad .dot{background:var(--bad)} .bad{color:var(--bad)}
.wait{color:var(--ink);font-weight:600}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:10px 16px;font-size:15px}
dt{color:var(--ink)} dd{margin:0;font-weight:600}

.note{margin-top:20px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--ink);line-height:1.7}

const TH='๐๑๒๓๔๕๖๗๘๙', th=s=>String(s||'').replace(/[0-9]/g,d=>TH[+d]);

const p=new URLSearchParams(location.search), v=(p.get('v')||'').trim();

function showOk(r){
  out.innerHTML=`<div class="status ok"><span class="dot">✓</span>เกียรติบัตรนี้ออกโดย สพป.นครพนม เขต ๑ จริง</div>

  <dt>ลงวันที่</dt><dd>${esc(th(r.date))}</dd></dl>`+NOTE;
}
function showBad(msg){ out.innerHTML=`<div class="status bad"><span class="dot">✕</span>${msg}</div>`+NOTE; }
(async()=>{
  if(p.get('demo')){ out.innerHTML='<div class="status wait">นี่คือ QR ของเกียรติบัตรตัวอย่าง ยังไม่ได้ออกให้บุคคลใด</div>'+NOTE; return; }

  if(REGISTRY[v]){ showOk(REGISTRY[v]); return; }
  try{
    const db=getFirestore(initializeApp(firebaseConfig));
    const s=await getDoc(doc(db,'certVerify',v));
    if(s.exists()){ const d=s.data(); showOk({c:d.course,name:d.name,num:d.num,date:d.date,courseName:d.courseName}); }
    else showBad('ไม่พบเกียรติบัตรนี้ในทะเบียน');
  }catch(e){ console.error(e); showBad('ตรวจสอบไม่สำเร็จ กรุณาลองใหม่อีกครั้ง'); }
})();
